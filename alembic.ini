# ---------------------------------------------------------------------------
# Alembic configuration — MIL Platform
#
# This file configures schema migration for the MIL platform.
# It is distinct from backend/alembic.ini which belongs to the legacy system.
#
# Run migrations:
#   make migrate                  — apply all pending migrations
#   alembic upgrade head          — equivalent direct command
#   alembic revision --autogenerate -m "description"  — generate new migration
#   alembic downgrade -1          — roll back one migration
#   alembic history               — show migration history
#
# The database URL is read from the ALEMBIC_DATABASE_URL environment variable
# (or constructed from POSTGRES_* variables) in migrations/env.py.
# It is intentionally absent here to prevent accidental connection to the
# wrong database when alembic.ini is shared across environments.
# ---------------------------------------------------------------------------

[alembic]
# Location of the migrations directory (relative to this file)
script_location = migrations

# Template for new migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate slug to this many characters in the filename
truncate_slug_length = 40

# Output encoding for migration scripts
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Logging
# Alembic uses Python's standard logging module.
# The loggers below are the standard Alembic loggers.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
